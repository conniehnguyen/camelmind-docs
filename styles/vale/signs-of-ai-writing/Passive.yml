extends: existence
message: "'%s' looks like passive voice."
ignorecase: true
level: suggestion
link: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
raw:
  - \b(am|are|were|being|is|been|was|be)\b\s*(?:(?:not|already|always|never|still|just|only|even|often|soon|yet|also|quite|rather|almost|\w+ly)\s+){0,2}
tokens:
  - founded
  - known
  - considered
  - established
  - recognized
  - created
  - regarded
  - developed
