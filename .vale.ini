# Vale prose linting — https://vale.sh
#
# Ships as a default CamelMind integration. Styles under styles/vale/ are
# vendored (checked into git) rather than fetched via `vale sync`, so linting
# behaves identically for every author without a network dependency.
#
# Run locally: npm run lint:prose  (requires the `vale` binary and `mdx2vast`
# on $PATH)
#
# Don't run the `vale` binary directly on files under content/ — it shells
# out to `mdx2vast` per-file, which dumps any custom JSX component's entire
# source (<Steps>, <Callout>, <Details>, <Tabs>, ...) into an unparsed code
# block that these rules never see. `npm run lint:prose` (or `node
# scripts/vale-preprocess.mjs <path>` for a single file) strips those
# wrapper tags first — see that script's header for the full explanation.

StylesPath = styles/vale

# CI only fails builds on error-level alerts; suggestion/warning are advisory.
MinAlertLevel = warning

# Exceptions used by *all* BasedOnStyles below.
Vocab = CamelMind

# Vale's official MDX package — handles inline-JS edge cases the base
# MDX parser (mdx2vast) can't resolve on its own.
Packages = MDX

[*.mdx]
BasedOnStyles = Vale, write-good, Microsoft, cm-light, CM, proselint, signs-of-ai-writing

# This codebase's house style is a spaced em dash (" — "), which conflicts
# with Microsoft's no-space convention — disable just that one rule.
Microsoft.Dashes = NO
